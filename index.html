<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="J.A.R.V.I.S. — A Quiet Intelligence. Hypnotic 3D Holographic Screensaver from Avengers: Age of Ultron." />
  <meta name="theme-color" content="#020203" />
  <title>J A R V I S — A Quiet Intelligence</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/jarvis.css" />
</head>
<body class="jarvis-screensaver">
  <!-- Primary 3D Holographic Canvas -->
  <canvas id="jarvis-canvas" aria-label="J.A.R.V.I.S. 3D Holographic Consciousness Sphere"></canvas>

  <!-- Minimalist Ambient Overlay (Drifts imperceptibly for OLED burn-in protection) -->
  <main id="hud-stage" class="ambient-ui">
    <!-- Top-Left Whisper Wordmark -->
    <header class="corner-brand">
      <h1 class="brand-title">J A R V I S</h1>
      <p class="brand-subtitle">A QUIET INTELLIGENCE</p>
    </header>

    <!-- Bottom-Left Subtle Shortcut Hint (Fades out completely when idle) -->
    <div class="corner-hint" id="corner-hint">
      SPACE TO PAUSE &nbsp;&middot;&nbsp; F FOR FULLSCREEN
    </div>

    <!-- Bottom-Center Floating Time & Date (Unboxed, Calm, Zero Distraction) -->
    <section class="time-anchor" aria-live="polite">
      <div class="time-row" role="timer" aria-label="Current Time">
        <span class="time-digits tabular" id="chrono-time">8:42</span>
        <span class="time-period" id="chrono-period">PM</span>
      </div>
      <div class="date-row tabular" id="chrono-date">
        TUESDAY, OCTOBER 20
      </div>
    </section>

    <!-- Bottom-Right Discreet Circular Icon Controls (Auto-hide on idle) -->
    <nav class="corner-controls" id="corner-controls" aria-label="Screensaver Controls">
      <button type="button" class="icon-btn" id="btn-pause" title="Pause / Resume Motion (Space)" aria-label="Pause or Resume Motion">
        <svg id="icon-pause" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="9" y1="6" x2="9" y2="18"></line>
          <line x1="15" y1="6" x2="15" y2="18"></line>
        </svg>
        <svg id="icon-play" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <polygon points="8 6 18 12 8 18 8 6"></polygon>
        </svg>
      </button>

      <button type="button" class="icon-btn active" id="btn-format" title="Toggle 12H / 24H Clock (T)" aria-label="Toggle 12-hour or 24-hour time format">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8"></circle>
          <polyline points="12 8 12 12 15 14"></polyline>
        </svg>
      </button>

      <button type="button" class="icon-btn" id="btn-audio" title="Toggle Meditative Ambient Harmonic Drone (A)" aria-label="Toggle Ambient Sound">
        <svg id="icon-muted" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="22" y1="9" x2="16" y2="15"></line>
          <line x1="16" y1="9" x2="22" y2="15"></line>
        </svg>
        <svg id="icon-unmuted" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
      </button>

      <button type="button" class="icon-btn" id="btn-fullscreen" title="Toggle Fullscreen (F)" aria-label="Toggle Fullscreen">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
          <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
          <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
        </svg>
      </button>
    </nav>
  </main>

  <script type="module" src="js/hud.js"></script>
</body>
</html>
